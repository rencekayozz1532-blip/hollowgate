name: apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Bundle the 3D engine so the app works offline
        run: curl -fL -o www/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js
      - run: npm install
      - run: npx cap add android
      - name: Lock to landscape
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Hollowgate.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hollowgate (latest)
          files: Hollowgate.apk
          make_latest: true
